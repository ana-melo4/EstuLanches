services:
  app:
    build: .
    ports:
      - "3001:3000"
    environment:
      DB_HOST: db
      DB_USER: estu
      DB_PASS: estu123
      DB_NAME: estulanches
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: estu
      POSTGRES_PASSWORD: estu123
      POSTGRES_DB: estulanches
    volumes:
      - dados:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estu -d estulanches"]
      interval: 5s
      retries: 5
    restart: always

volumes:
  dados:
